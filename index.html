<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FieldReady Nurse Competency Study</title>
  <meta name="description" content="Research-locked evaluator app for longitudinal Air Force nurse TCCC competency study." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">FR</div><div><strong>FieldReady</strong><span>Nurse Competency Study</span></div></div>
    <nav>
      <button data-nav="dashboard">Dashboard</button>
      <button data-nav="new">New Encounter</button>
      <button data-nav="calibration">Calibration</button>
      <button data-nav="exports">Exports</button>
      <button data-nav="about">About</button>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <template id="splash-template">
    <section class="splash">
      <div class="hero-copy">
        <p class="eyebrow">Research-locked build</p>
        <h1>Measure retention. Protect validity. Build capability.</h1>
        <p>This app supports a longitudinal pilot of TCCC skill retention among Air Force nurses. It captures criterion-level performance, timers, simplified failure patterns, evaluator-attributed contributors, app version, scenario version, and study metadata.</p>
        <div class="safeguards">
          <h2>Required safeguards</h2>
          <ul>
            <li>Use participant IDs only. Do not enter SSN, DoD ID, PHI, casualty data, or classified/CUI content.</li>
            <li>This is an education/research data-capture tool, not clinical decision support or a medical record.</li>
            <li>Use only the PI-approved source-locked checklist and scenario version for active study data.</li>
            <li>Browser storage is temporary. Export and back up finalized records into approved study storage.</li>
          </ul>
        </div>
        <label class="ack"><input type="checkbox" id="ack" /> I am authorized to use this study tool and will protect research records.</label>
        <button id="enterApp" class="primary" disabled>Enter study app</button>
      </div>
      <div class="hero-panel">
        <h3>Final-stage corrections built in</h3>
        <div class="metric"><b>5</b><span>failure modes</span></div>
        <div class="metric"><b>5</b><span>primary contributors</span></div>
        <div class="metric"><b>0</b><span>unclassified fails allowed at finalization</span></div>
        <div class="metric"><b>1</b><span>source of truth: protocol + locked checklist</span></div>
      </div>
    </section>
  </template>

  <script src="study-config.js"></script>
  <script src="checklist-cmc.js"></script>
  <script src="app.js"></script>
</body>
</html>
